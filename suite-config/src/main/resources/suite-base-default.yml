# SpringSuite base configuration.
# Created and supplemented by suite-config bootstrap.
# Module-owned configuration lives in sibling files generated by module contributors.

server:
  port: 8090

spring:
  application:
    name: spring-suite
  output:
    ansi:
      enabled: ALWAYS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: logs/spring-suite.log
  level:
    root: INFO
    operator: INFO
    com.takesome.springsuite: INFO
