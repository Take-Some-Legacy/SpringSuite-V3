        enabled: false
        title: Unassigned
        route: ""
      - code: FN-04
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-05
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-06
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-07
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-08
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-09
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-10
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-11
        enabled: false
        title: Unassigned
        route: ""
      - code: FN-12
        enabled: true
        title: Send Desktop Screenshot
        route: desktop.screenshot.send
        risk-tier: visual-private
        destination: active-chat
        args:
          target: virtual
          maxWidth: 0
