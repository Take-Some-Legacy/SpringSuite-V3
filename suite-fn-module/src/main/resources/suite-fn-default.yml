# SpringSuite FN operator module configuration.
# Owned by suite-fn-module.

suite:
  fn:
    enabled: true
    button-count: 12
    namespace: fn
    dispatch-mode: explicit-operator-action
    default-destination: active-chat
    buttons:
      - code: FN-01
        enabled: false
        title: Unassigned
        route: ""
