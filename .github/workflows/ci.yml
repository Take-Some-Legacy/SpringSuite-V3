name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Verify module boundaries and run tests
        if: runner.os != 'Windows'
        run: ./gradlew verifyModuleBoundaries test --no-daemon --stacktrace

      - name: Verify module boundaries and run tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat verifyModuleBoundaries test --no-daemon --stacktrace

  deploy-image:
    name: Verify deploy image
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Assemble and verify runtime image
        shell: pwsh
        run: .\gradlew.bat verifyDeployLayout --no-daemon --stacktrace

      - name: Verify repository invariants
        shell: pwsh
        run: .\scripts\verify-repository.ps1 -VerifyDeployImage

      - name: Upload runtime image
        uses: actions/upload-artifact@v4
        with:
          name: spring-suite-runtime
          path: build/deploy
          if-no-files-found: error
