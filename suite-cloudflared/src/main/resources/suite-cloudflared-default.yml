# SpringSuite cloudflared tunnel configuration.
# Owned by suite-cloudflared.

suite:
  cloudflared:
    enabled: true
    auto-start: true
    executable: cloudflared
    wrapper-enabled: true
    wrapper-executable: suiteBinaries/suite-cloudflared-wrapper
    origin-cert-path: ${TUNNEL_ORIGIN_CERT:}
    target-url: http://localhost:${server.port:8090}
    tunnel-name: spring-suite-test
    hostname: testspring.kaylas-systems.ru
    cache-directory: .springsuite/cloudflared
    extra-args:
      - --no-autoupdate
    stop-timeout: 5s
    recent-log-limit: 300
