# SpringSuite desktop helper AI suite.
# The module is local-first and assistive by default: it reads context, generates hints,
# and plans form filling. Actual desktop writes must be enabled and approved separately.

suite:
  desktop-helper:
    enabled: true
    mode: assistive
    ai-enrichment-enabled: true
    require-approval-for-write-actions: true
    allow-desktop-capture: true
    allow-clipboard-read: false
    allow-clipboard-write: false
    allow-form-fill-planning: true
    allow-autofill-execution: false
    allow-submit-actions: false
    capture-tool-id: suite-desktop-capture
    context-ttl: 30s
    approval-token-ttl-seconds: 120
    max-approval-token-ttl-seconds: 900
    max-screen-text-chars: 12000
    max-suggestion-count: 6
    browser-dom:
      enabled: true
      require-token: true
      token: ${SPRINGSUITE_BROWSER_DOM_TOKEN:}
      write-enabled: true
      preserve-existing-values: true
      command-ttl: 20s
      max-snapshot-age: 20s
      max-future-skew: 30s
      max-forms: 64
      max-fields-per-form: 256
      max-options-per-field: 100
      allowed-schemes:
        - http
        - https
    executor:
      default-id: noop-desktop-action-executor
      allowed-real-input: false
    executors:
      noop-desktop-action-executor:
        enabled: true
      real-desktop-action-executor:
        enabled: false
      clipboard-desktop-action-executor:
        enabled: false
      keyboard-desktop-action-executor:
        enabled: false
      mouse-desktop-action-executor:
        enabled: false
      browser-dom-desktop-action-executor:
        enabled: false
      windows-ui-automation-desktop-action-executor:
        enabled: false
    bridge:
      allowed-real-input: false
    bridges:
      clipboard-bridge-adapter:
        enabled: false
      keyboard-bridge-adapter:
        enabled: false
      mouse-bridge-adapter:
        enabled: false
      browser-dom-bridge-adapter:
        enabled: true
      windows-ui-automation-bridge-adapter:
        enabled: true
    agent:
      enabled: true
      tray-enabled: true
      overlay-enabled: true
      poll-interval: 900ms
      stable-for: 700ms
      repeat-after: 30s
      minimum-field-count: 1
      maximum-action-count: 8
      locale: ru-RU
      sidecar:
        enabled: true
        auto-start: true
        auto-build: false
        executable: suiteBinaries/suite-desktop-agent.exe
        project-root: ../suite-desktop-agent-go
        host: 127.0.0.1
        # 0 asks SpringSuite to reserve an available loopback port.
        port: 0
        startup-timeout: 12s
        request-timeout: 10s
        shutdown-timeout: 3s
      # Local-only values used to propose deterministic form actions.
      # Example keys: firstName, lastName, email, phone, company, address, city, postalCode, country.
      autofill-profile: {}
      constraints: {}
    sensitive-field-hints:
      - password
      - passcode
      - token
      - secret
      - api key
      - card
      - cvv
      - iban
      - bank
      - ssn
      - social security
      - passport
    surfaces:
      active-window:
        enabled: true
        access: read
        adapter: suite-desktop-capture
        capabilities:
          - process
          - title
          - url
          - focused-control
      screen-text:
        enabled: true
        access: read
        adapter: suite-desktop-capture
        capabilities:
          - ocr
          - visible-text
          - selected-text
      clipboard:
        enabled: false
        access: read-write
        adapter: platform
        capabilities:
          - clipboard-preview
          - copy-suggestion
      browser-form:
        enabled: true
        access: read-plan
        adapter: springsuite-form-bridge-extension
        capabilities:
          - html-form-detection
          - label-resolution
          - field-detection
          - action-method-recognition
          - fill-plan
          - validation-hints
      keyboard-mouse:
        enabled: false
        access: write
        adapter: accessibility-driver
        capabilities:
          - type
          - hotkey
          - click
