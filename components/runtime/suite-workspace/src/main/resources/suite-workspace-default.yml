# SpringSuite workspace filesystem access.
# Owned by suite-workspace.

suite:
  workspace:
    enabled: true
    # Workspace roots allowed for agent/human file operations.
    # Relative paths are resolved from the SpringSuite runtime root.
    roots:
      - .
    allow-read: true
    allow-write: true
    allow-delete: false
    create-backups: true
    max-read-bytes: 2097152
    max-search-results: 200
    max-tree-items: 2000
    max-file-size-bytes: 8388608
    max-search-files: 25000
    max-search-bytes: 268435456
    max-search-duration: 8s
    repository-housekeeping-delay: 30s
    repository-descriptor-auto-create: true
    repository-descriptor-file: .springsuite-repository.json
    repository-descriptor-scan-depth: 0
    repository-cache-enabled: true
    repository-cache-remember-discovered: true
    repository-cache-file: .springsuite/repositories.json
    repository-cache-roots: []
    deny-segments:
      - .git
      - .gradle
      - .idea
      - build
      - out
      - target
      - node_modules
      - __pycache__
    text-extensions:
      - .java
      - .kt
      - .kts
      - .gradle
      - .xml
      - .yml
      - .yaml
      - .json
      - .md
      - .txt
      - .properties
      - .toml
      - .ini
      - .bat
      - .cmd
      - .ps1
      - .sh
      - .py
      - .rs
      - .js
      - .ts
      - .css
      - .html
      - .gitignore
      - .c
      - .cc
      - .cpp
      - .cxx
      - .h
      - .hpp
      - .hxx
      - .go
      - .cs
      - .lua
      - .sql
      - .proto
      - .cmake
      - .glsl
      - .vert
      - .frag
      - .comp
      - .hlsl
      - .wgsl
      - .tsx
      - .jsx
      - .scss
      - .vue
      - .svelte
      - .gltf
