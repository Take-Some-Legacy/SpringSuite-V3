# SpringSuite external configuration.
# This file is copied to ./config/spring-suite.yml on first launch.
# Edit the generated file; do not put local machine/domain values into Java code.

server:
  # Listen on all interfaces so the agent/API remain reachable from the trusted LAN.
  address: 0.0.0.0
  port: 8090
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  application:
    name: spring-suite
  web:
    resources:
      static-locations:
        - "file:${suite.working.directory:./}/static/"
  output:
    ansi:
      enabled: ALWAYS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: logs/spring-suite.log
  level:
    root: INFO
    operator: INFO
    com.takesome.springsuite: INFO

suite:
  console:
    ansi:
      enabled: true
      probe: true
    command:
      enabled: true
      prompt: "> "
      print-welcome: true
      allow-shutdown: true
      # Keep MCP/API availability stable: remote callers cannot terminate the runtime by default.
      allow-shutdown-over-api: false
  operator:
    logging:
      ring-buffer-size: 0
  cloudflared:
    enabled: true
    auto-start: true
    executable: cloudflared
    wrapper-enabled: true
    wrapper-executable: suiteBinaries/suite-cloudflared-wrapper
    origin-cert-path: ${TUNNEL_ORIGIN_CERT:}
    target-url: http://localhost:${server.port:8090}
    tunnel-name: spring-suite-test
    hostname: testspring.kaylas-systems.ru
    extra-args:
      - --no-autoupdate
    stop-timeout: 5s
    recent-log-limit: 0

  toolbelt:
    enabled: true
    # Tool descriptor scan roots. Relative paths are resolved from the SpringSuite runtime root.
    # By default SpringSuite reads only its own local tools from ./tools.
    scan-roots:
      - tools
    include-path-tools: true
    allow-execution: true
    default-timeout: 0s
    max-stdout-bytes: 0
    max-stderr-bytes: 0
    path-tools:
      - git
      - java
      - javac
      - python
      - py
      - cloudflared
      - gradle
