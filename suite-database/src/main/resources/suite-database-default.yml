# SpringSuite SQL database and HTTP request journal.
# Owned by suite-database. The default H2 database is persistent and stored under ./data.

spring:
  datasource:
    url: jdbc:h2:file:./data/spring-suite;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: SpringSuiteSql
      minimum-idle: 1
      maximum-pool-size: 64
      connection-timeout: 10000
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    validate-on-migrate: true

suite:
  database:
    enabled: true
    request-journal:
      enabled: true
      capture-request-body: true
      capture-response-body: true
      redact-sensitive-data: true
      max-request-body-bytes: 0
      max-response-body-bytes: 0
      max-header-value-chars: 0
      max-search-document-chars: 0
      default-page-size: 0
      max-page-size: 0
      # Capture every inbound HTTP route by default. Exclusions below prevent recursion and health noise.
      include-paths:
        - /
      exclude-paths:
        - /api/admin/requests
        - /api/operator/logs/stream
        - /api/desktop-helper/browser-dom/snapshot
        - /actuator/
