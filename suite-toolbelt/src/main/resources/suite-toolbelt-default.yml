# SpringSuite toolbelt registry and executor configuration.
# Owned by suite-toolbelt.

suite:
  toolbelt:
    enabled: true
    # Tool descriptor scan roots. Relative paths are resolved from the SpringSuite runtime root.
    # Keep the second path while SpringSuite reuses the Python NorthStar-Suite toolbelt.
    scan-roots:
      - tools
      - ../../Take Some/NorthStar-Suite/tools
    include-path-tools: true
    allow-execution: false
    default-timeout: 30s
    max-stdout-bytes: 12000
    max-stderr-bytes: 8000
    path-tools:
      - git
      - java
      - javac
      - python
      - py
      - cloudflared
      - gradle
